<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♠️ 越記越多的記帳本 ♣️</title>
    <!-- Tailwind CSS -->
    <script src="vendor/tailwind.js"></script>
    <!-- Chart.js for Profit Curve -->
    <script src="vendor/chart.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="vendor/fontawesome.css">
    <!-- Google Fonts: Poppins & Fredoka -->
    <link href="vendor/fonts.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"PingFang TC"', '"Noto Sans TC"', '"Microsoft JhengHei"', 'system-ui', 'sans-serif'],
                        display: ['"Fredoka"', 'sans-serif'],
                    },
                    colors: {
                        felt: {
                            darkest: '#030705',
                            dark: '#07120d',
                            DEFAULT: '#0d1b14',
                            light: '#1b3b2c',
                        },
                        poker: {
                            red: '#ef4444',
                            darkRed: '#b91c1c',
                            gold: '#fbbf24',
                            darkGold: '#d97706',
                            chipBlue: '#3b82f6',
                            chipBlack: '#1f2937',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            background-color: #030705 !important;
            background: linear-gradient(135deg, #030705 0%, #07120d 50%, #020503 100%) !important;
            min-height: 100vh;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
        }

        /* Felt texture background effect */
        .felt-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* 3D Poker Button Effect */
        .btn-poker {
            position: relative;
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            font-weight: 600;
            border-radius: 9999px;
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.6), 0 8px 16px rgba(0, 0, 0, 0.4);
            transform: translateY(0);
        }
        .btn-poker:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.6), 0 3px 6px rgba(0, 0, 0, 0.4);
        }

        .btn-gold {
            background: linear-gradient(180deg, #fef08a 0%, #fbbf24 50%, #d97706 100%);
            color: #111827;
            border: 2px solid #fef9c3;
        }
        .btn-red {
            background: linear-gradient(180deg, #fca5a5 0%, #ef4444 50%, #b91c1c 100%);
            color: #ffffff;
            border: 2px solid #fee2e2;
        }
        .btn-green {
            background: linear-gradient(180deg, #34d399 0%, #10b981 50%, #047857 100%);
            color: #ffffff;
            border: 2px solid #d1fae5;
        }
        .btn-dark {
            background: linear-gradient(180deg, #1f2937 0%, #111827 50%, #030705 100%);
            color: #f3f4f6;
            border: 2px solid #374151;
        }
        .btn-active-tab {
            background: linear-gradient(180deg, #fef08a 0%, #fbbf24 50%, #d97706 100%) !important;
            color: #111827 !important;
            border: 2px solid #fef9c3 !important;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.5), 0 3px 0 rgba(0, 0, 0, 0.6) !important;
        }

        /* Card suit icon glowing */
        .suit-glow {
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }

        /* Custom scrollbar for dark mode */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #030705;
        }
        ::-webkit-scrollbar-thumb {
            background: #12261c;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #1b3b2c;
        }

        .glass-panel {
            background: rgba(7, 18, 13, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
    </style>

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d1b14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="越記越多的記帳本">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="線上撲克與桌遊記帳軟體：買入、出金、水錢累計追蹤與獲利曲線圖">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body class="felt-pattern font-sans antialiased pb-28">

    <header class="max-w-4xl mx-auto px-4 pt-8 pb-4 text-center">
        <div class="flex justify-center items-center space-x-3 mb-2">
            <span class="text-3xl md:text-4xl text-red-500 suit-glow">♠️</span>
            <span class="text-3xl md:text-4xl text-gray-300 suit-glow">♣️</span>
            <h1 class="text-3xl md:text-5xl font-black font-display tracking-wider bg-gradient-to-r from-yellow-200 via-amber-400 to-yellow-500 bg-clip-text text-transparent drop-shadow-lg">
                越記越多的記帳本
            </h1>
            <span class="text-3xl md:text-4xl text-red-500 suit-glow">♥️</span>
            <span class="text-3xl md:text-4xl text-gray-300 suit-glow">♦️</span>
        </div>
        <p class="text-emerald-400/80 text-sm md:text-base font-medium">清晰簡潔的沈浸式暗色系戰績管理</p>
    </header>

    <main class="max-w-4xl mx-auto px-4 space-y-6">
        <!-- 頂部區：遊戲項目獨立切換按鈕列 (改為網格整齊排列，按鈕大小一致) -->
        <div class="glass-panel rounded-2xl p-4 shadow-xl">
            <div class="text-xs text-emerald-400 font-medium mb-3 flex items-center justify-between">
                <span><i class="fa-solid fa-gamepad text-yellow-400 mr-1.5"></i> 選擇欲檢視的遊戲項目 (點擊切換)</span>
                <span id="activeGameIndicator" class="text-yellow-300 font-bold">目前顯示：全部總和</span>
            </div>
            <div id="gameFilterButtons" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5">
                <!-- 動態載入遊戲切換按鈕 -->
            </div>
        </div>

        <!-- 統計總覽儀表板 (乾淨簡潔) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- 總淨利 -->
            <div class="glass-panel rounded-2xl p-4 shadow-xl border-t-4 border-yellow-400 text-center relative overflow-hidden">
                <div class="absolute -right-3 -bottom-3 text-yellow-400/5 text-6xl font-black font-display">♠</div>
                <div class="text-xs md:text-sm text-emerald-400 font-medium mb-1"><i class="fa-solid fa-trophy text-yellow-400 mr-1"></i> <span id="labelNetProfitTitle">總淨利</span></div>
                <div id="statNetProfit" class="text-xl md:text-2xl font-black font-display tracking-tight text-white">$0</div>
            </div>
            <!-- 總買入 -->
            <div class="glass-panel rounded-2xl p-4 shadow-xl border-t-4 border-red-500 text-center relative overflow-hidden">
                <div class="absolute -right-3 -bottom-3 text-red-500/5 text-6xl font-black font-display">♥</div>
                <div class="text-xs md:text-sm text-emerald-400 font-medium mb-1"><i class="fa-solid fa-arrow-down text-red-400 mr-1"></i> <span id="labelBuyinTitle">總買入</span></div>
                <div id="statTotalBuyin" class="text-xl md:text-2xl font-black font-display tracking-tight text-white">$0</div>
            </div>
            <!-- 總出金 -->
            <div class="glass-panel rounded-2xl p-4 shadow-xl border-t-4 border-blue-500 text-center relative overflow-hidden">
                <div class="absolute -right-3 -bottom-3 text-blue-500/5 text-6xl font-black font-display">♣</div>
                <div class="text-xs md:text-sm text-emerald-400 font-medium mb-1"><i class="fa-solid fa-arrow-up text-blue-400 mr-1"></i> <span id="labelCashoutTitle">總出金</span></div>
                <div id="statTotalCashout" class="text-xl md:text-2xl font-black font-display tracking-tight text-white">$0</div>
            </div>
            <!-- 總水錢 -->
            <div class="glass-panel rounded-2xl p-4 shadow-xl border-t-4 border-emerald-400 text-center relative overflow-hidden">
                <div class="absolute -right-3 -bottom-3 text-emerald-400/5 text-6xl font-black font-display">♦</div>
                <div class="text-xs md:text-sm text-emerald-400 font-medium mb-1"><i class="fa-solid fa-coins text-emerald-400 mr-1"></i> <span id="labelRakeTitle">總水錢</span></div>
                <div id="statTotalRake" class="text-xl md:text-2xl font-black font-display tracking-tight text-white">$0</div>
            </div>
        </div>

        <!-- 主要操作與功能選單按鈕列 (改為網格整齊排列，大小一致) -->
        <div class="glass-panel rounded-2xl p-5 shadow-xl space-y-3">
            <div class="text-xs text-emerald-400 font-medium mb-2"><i class="fa-solid fa-toolbox text-yellow-400 mr-1.5"></i> 核心功能與資料管理區</div>
            <div id="actionButtonsRow" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5">
                <button onclick="openRecordModal()" class="btn-poker btn-gold px-3 py-3 text-xs md:text-sm shadow-lg flex items-center justify-center space-x-1.5 truncate">
                    <i class="fa-solid fa-circle-plus shrink-0"></i>
                    <span class="truncate">新增記帳紀錄</span>
                </button>
                <button onclick="openQuickAddGameModal()" class="btn-poker btn-green px-3 py-3 text-xs md:text-sm shadow-lg flex items-center justify-center space-x-1.5 truncate">
                    <i class="fa-solid fa-square-plus shrink-0"></i>
                    <span class="truncate">自訂新增遊戲欄位</span>
                </button>
                <button onclick="openChartModal()" class="btn-poker btn-dark px-3 py-3 text-xs md:text-sm shadow-lg flex items-center justify-center space-x-1.5 truncate">
                    <i class="fa-solid fa-chart-line text-yellow-400 shrink-0"></i>
                    <span class="truncate">查看營利曲線圖</span>
                </button>
                <button onclick="openRecordsModal()" class="btn-poker btn-dark px-3 py-3 text-xs md:text-sm shadow-lg flex items-center justify-center space-x-1.5 truncate">
                    <i class="fa-solid fa-history text-blue-400 shrink-0"></i>
                    <span class="truncate">戰績明細列表</span>
                </button>
                <button onclick="openGameManagerModal()" class="btn-poker btn-dark px-3 py-3 text-xs md:text-sm shadow-lg flex items-center justify-center space-x-1.5 truncate">
                    <i class="fa-solid fa-gamepad shrink-0"></i>
                    <span class="truncate">管理遊戲項目</span>
                </button>
                <button onclick="exportData()" class="btn-poker btn-dark px-3 py-3 text-xs md:text-sm shadow-lg flex items-center justify-center space-x-1.5 truncate">
                    <i class="fa-solid fa-download shrink-0"></i>
                    <span class="truncate">匯出備份</span>
                </button>
                <label class="btn-poker btn-dark px-3 py-3 text-xs md:text-sm shadow-lg flex items-center justify-center space-x-1.5 cursor-pointer truncate">
                    <i class="fa-solid fa-upload shrink-0"></i>
                    <span class="truncate">匯入還原</span>
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </div>
    </main>

    <!-- 新增/編輯紀錄 互動彈窗 -->
    <div id="recordModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-6 md:p-8 shadow-2xl border border-yellow-500/30 relative">
            <button onclick="closeRecordModal()" class="absolute top-5 right-5 text-emerald-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 id="recordModalTitle" class="text-2xl font-bold font-display text-yellow-300 mb-6 flex items-center">
                <i class="fa-solid fa-pen-nib mr-2"></i> 新增戰績記帳
            </h3>

            <form id="recordForm" onsubmit="saveRecord(event)" class="space-y-4">
                <input type="hidden" id="recordId">
                <div>
                    <label class="block text-sm font-medium text-emerald-400 mb-1">日期時間</label>
                    <input type="datetime-local" id="recordDate" required class="w-full bg-[#030705] border border-emerald-800/80 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-emerald-400 mb-1">遊戲類型</label>
                    <select id="recordGame" required class="w-full bg-[#030705] border border-emerald-800/80 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
                        <!-- 動態填入遊戲選單 -->
                    </select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-emerald-400 mb-1">買入金額 ($)</label>
                        <input type="number" id="recordBuyin" value="0" min="0" step="any" required class="w-full bg-[#030705] border border-emerald-800/80 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-emerald-400 mb-1">出金金額 ($)</label>
                        <input type="number" id="recordCashout" value="0" min="0" step="any" required class="w-full bg-[#030705] border border-emerald-800/80 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-emerald-400 mb-1">當週水錢 ($)</label>
                        <input type="number" id="recordRake" value="0" min="0" step="any" required class="w-full bg-[#030705] border border-emerald-800/80 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-emerald-400 mb-1">備註說明 (牌局狀況、桌號等)</label>
                    <textarea id="recordNote" rows="2" placeholder="例如：聽牌逆轉勝..." class="w-full bg-[#030705] border border-emerald-800/80 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeRecordModal()" class="btn-poker btn-dark px-5 py-2.5 text-sm">取消</button>
                    <button type="submit" class="btn-poker btn-gold px-6 py-2.5 text-sm">儲存紀錄</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 獲利曲線圖表彈窗 -->
    <div id="chartModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-3xl rounded-3xl p-6 md:p-8 shadow-2xl border border-yellow-500/30 relative">
            <button onclick="closeChartModal()" class="absolute top-5 right-5 text-emerald-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 id="chartTitle" class="text-2xl font-bold font-display text-yellow-300 mb-4 flex items-center">
                <i class="fa-solid fa-chart-line mr-2"></i> 累積獲利曲線圖
            </h3>
            <div class="relative w-full h-80 md:h-96 my-4">
                <canvas id="profitChart"></canvas>
            </div>
            <div class="flex justify-end pt-2">
                <button type="button" onclick="closeChartModal()" class="btn-poker btn-dark px-5 py-2.5 text-sm">關閉</button>
            </div>
        </div>
    </div>

    <!-- 戰績明細列表彈窗 -->
    <div id="recordsModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-4xl rounded-3xl p-6 md:p-8 shadow-2xl border border-emerald-500/30 relative max-h-[90vh] flex flex-col">
            <button onclick="closeRecordsModal()" class="absolute top-5 right-5 text-emerald-400 hover:text-white text-xl z-10">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 gap-3 pr-8">
                <h3 class="text-2xl font-bold font-display text-yellow-300 flex items-center">
                    <i class="fa-solid fa-history mr-2"></i> 戰績明細紀錄
                </h3>
                <div class="flex items-center space-x-2">
                    <label class="text-xs text-emerald-400 whitespace-nowrap">篩選遊戲：</label>
                    <select id="modalFilterGame" onchange="renderRecordsModalList()" class="bg-[#030705] text-white border border-emerald-800/80 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400">
                        <option value="ALL">全部總和 (All Games)</option>
                    </select>
                </div>
            </div>

            <div class="overflow-y-auto flex-1 pr-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-emerald-900/80 text-emerald-400 text-xs md:text-sm uppercase tracking-wider font-display sticky top-0 bg-[#07120d]">
                            <th class="py-3 px-3">日期</th>
                            <th class="py-3 px-3">遊戲類型</th>
                            <th class="py-3 px-3 text-right">買入</th>
                            <th class="py-3 px-3 text-right">出金</th>
                            <th class="py-3 px-3 text-right">水錢</th>
                            <th class="py-3 px-3 text-right">淨損益</th>
                            <th class="py-3 px-3 text-center">備註</th>
                            <th class="py-3 px-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody" class="divide-y divide-emerald-950/60 text-sm md:text-base">
                        <!-- 紀錄會動態載入 -->
                    </tbody>
                </table>
                <div id="emptyState" class="text-center py-12 text-emerald-500/50 hidden">
                    <div class="text-5xl mb-3">♠️ 🎴 ♥️</div>
                    <p>目前還沒有任何記帳紀錄，趕快點擊「新增記帳紀錄」開始記錄戰績吧！</p>
                </div>
            </div>

            <div class="flex justify-end pt-4 mt-2 border-t border-emerald-900/50">
                <button type="button" onclick="closeRecordsModal()" class="btn-poker btn-dark px-5 py-2.5 text-sm">關閉</button>
            </div>
        </div>
    </div>

    <!-- 自訂新增遊戲欄位彈窗 -->
    <div id="quickAddGameModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-yellow-500/30 relative">
            <button onclick="closeQuickAddGameModal()" class="absolute top-4 right-4 text-emerald-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h4 class="text-xl font-bold font-display text-yellow-300 mb-3 flex items-center">
                <i class="fa-solid fa-square-plus mr-2"></i> 自訂新增遊戲欄位
            </h4>
            <p class="text-xs text-emerald-400/70 mb-4">輸入新的遊戲名稱，即可立即建立獨立的項目與快捷按鈕。</p>
            <div class="space-y-4">
                <input type="text" id="quickGameInput" placeholder="例如：奧馬哈撲克, 21點..." class="w-full bg-[#030705] border border-emerald-800/80 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeQuickAddGameModal()" class="btn-poker btn-dark px-4 py-2 text-sm">取消</button>
                    <button type="button" onclick="submitQuickAddGame()" class="btn-poker btn-gold px-5 py-2 text-sm">確認新增</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 遊戲管理清單彈窗 -->
    <div id="gameManagerModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 md:p-8 shadow-2xl border border-emerald-500/30 relative">
            <button onclick="closeGameManagerModal()" class="absolute top-5 right-5 text-emerald-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-2xl font-bold font-display text-yellow-300 mb-4 flex items-center">
                <i class="fa-solid fa-gamepad mr-2"></i> 管理所有遊戲欄位
            </h3>
            <p class="text-xs text-emerald-400/80 mb-4">檢視與刪除現有的遊戲欄位項目。</p>

            <div class="max-h-60 overflow-y-auto space-y-2 pr-1 mb-6" id="gameListContainer">
                <!-- 遊戲清單會動態產生 -->
            </div>

            <div class="flex justify-end pt-2">
                <button type="button" onclick="closeGameManagerModal()" class="btn-poker btn-dark px-5 py-2 text-sm">關閉</button>
            </div>
        </div>
    </div>

    <!-- 自訂訊息提示彈窗 -->
    <div id="msgModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-yellow-500/30 text-center relative">
            <div id="msgIcon" class="text-4xl mb-3 text-yellow-400">♠️</div>
            <h4 id="msgTitle" class="text-xl font-bold font-display text-white mb-2">提示訊息</h4>
            <p id="msgText" class="text-emerald-400 text-sm mb-6">內容...</p>
            <button onclick="closeMsgModal()" class="btn-poker btn-gold px-6 py-2.5 text-sm w-full">確定</button>
        </div>
    </div>

    <script>
        const DEFAULT_GAMES = [
            '德州撲克現金桌',
            '德州撲克錦標賽',
            '十三張'
        ];

        let gamesList = JSON.parse(localStorage.getItem('poker_games')) || DEFAULT_GAMES;
        let recordsList = JSON.parse(localStorage.getItem('poker_records')) || [];
        let currentFilterGame = 'ALL';
        let profitChartInstance = null;

        window.onload = function() {
            initDateInput();
            renderGameFilterButtons();
            updateGameOptions();
            updateDashboardStats();
        };

        function initDateInput() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('recordDate').value = now.toISOString().slice(0, 16);
        }

        function showMessage(title, text, type = 'info') {
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerText = text;
            const iconEl = document.getElementById('msgIcon');
            if (type === 'success') {
                iconEl.innerHTML = '🏆';
            } else if (type === 'error') {
                iconEl.innerHTML = '⚠️';
            } else {
                iconEl.innerHTML = '♠️';
            }
            document.getElementById('msgModal').classList.remove('hidden');
        }

        function closeMsgModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }

        function renderGameFilterButtons() {
            const container = document.getElementById('gameFilterButtons');
            if (!container) return;
            container.innerHTML = '';

            // 全部總和按鈕
            const allBtn = document.createElement('button');
            allBtn.className = `btn-poker px-3 py-2.5 text-xs md:text-sm shadow-md flex items-center justify-center space-x-1 truncate ${currentFilterGame === 'ALL' ? 'btn-active-tab' : 'btn-dark'}`;
            allBtn.innerHTML = '<i class="fa-solid fa-layer-group shrink-0 mr-1"></i><span class="truncate">全部總和</span>';
            allBtn.onclick = () => selectGameFilter('ALL');
            container.appendChild(allBtn);

            // 各遊戲獨立按鈕
            gamesList.forEach(game => {
                const btn = document.createElement('button');
                btn.className = `btn-poker px-3 py-2.5 text-xs md:text-sm shadow-md flex items-center justify-center space-x-1 truncate ${currentFilterGame === game ? 'btn-active-tab' : 'btn-dark'}`;
                btn.innerHTML = `<i class="fa-solid fa-dice text-yellow-400 shrink-0 mr-1"></i><span class="truncate">${game}</span>`;
                btn.onclick = () => selectGameFilter(game);
                container.appendChild(btn);
            });

            const indicator = document.getElementById('activeGameIndicator');
            if (indicator) {
                indicator.innerText = currentFilterGame === 'ALL' ? '目前顯示：全部總和' : `目前顯示：${currentFilterGame}`;
            }
        }

        function selectGameFilter(game) {
            currentFilterGame = game;
            renderGameFilterButtons();
            updateDashboardStats();
        }

        function updateGameOptions() {
            const recordGameSelect = document.getElementById('recordGame');
            const modalFilterSelect = document.getElementById('modalFilterGame');
            
            const currentSelectedRecordGame = recordGameSelect.value;
            const currentSelectedModalFilter = modalFilterSelect.value;

            recordGameSelect.innerHTML = '';
            modalFilterSelect.innerHTML = '<option value="ALL">全部總和 (All Games)</option>';

            gamesList.forEach(game => {
                const opt1 = document.createElement('option');
                opt1.value = game;
                opt1.textContent = game;
                recordGameSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = game;
                opt2.textContent = game;
                modalFilterSelect.appendChild(opt2);
            });

            if (gamesList.includes(currentSelectedRecordGame)) {
                recordGameSelect.value = currentSelectedRecordGame;
            }
            if (currentSelectedModalFilter === 'ALL' || gamesList.includes(currentSelectedModalFilter)) {
                modalFilterSelect.value = currentSelectedModalFilter;
            }
        }

        function openRecordModal(id = null) {
            document.getElementById('recordModal').classList.remove('hidden');
            if (id) {
                document.getElementById('recordModalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square mr-2"></i> 編輯戰績記帳';
                const rec = recordsList.find(r => r.id === id);
                if (rec) {
                    document.getElementById('recordId').value = rec.id;
                    document.getElementById('recordDate').value = rec.date;
                    document.getElementById('recordGame').value = rec.game;
                    document.getElementById('recordBuyin').value = rec.buyin;
                    document.getElementById('recordCashout').value = rec.cashout;
                    document.getElementById('recordRake').value = rec.rake;
                    document.getElementById('recordNote').value = rec.note || '';
                }
            } else {
                document.getElementById('recordModalTitle').innerHTML = '<i class="fa-solid fa-pen-nib mr-2"></i> 新增戰績記帳';
                document.getElementById('recordForm').reset();
                document.getElementById('recordId').value = '';
                initDateInput();
            }
        }

        function closeRecordModal() {
            document.getElementById('recordModal').classList.add('hidden');
        }

        function saveRecord(e) {
            e.preventDefault();
            const id = document.getElementById('recordId').value;
            const date = document.getElementById('recordDate').value;
            const game = document.getElementById('recordGame').value;
            const buyin = parseFloat(document.getElementById('recordBuyin').value) || 0;
            const cashout = parseFloat(document.getElementById('recordCashout').value) || 0;
            const rake = parseFloat(document.getElementById('recordRake').value) || 0;
            const note = document.getElementById('recordNote').value.trim();

            if (id) {
                const index = recordsList.findIndex(r => r.id === id);
                if (index !== -1) {
                    recordsList[index] = { id, date, game, buyin, cashout, rake, note };
                }
            } else {
                const newRec = {
                    id: 'rec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    date,
                    game,
                    buyin,
                    cashout,
                    rake,
                    note
                };
                recordsList.push(newRec);
            }

            recordsList.sort((a, b) => new Date(b.date) - new Date(a.date));

            saveDataToLocalStorage();
            closeRecordModal();
            updateDashboardStats();
            if (!document.getElementById('recordsModal').classList.contains('hidden')) {
                renderRecordsModalList();
            }
            if (!document.getElementById('chartModal').classList.contains('hidden')) {
                renderProfitChart();
            }
            showMessage('成功', '戰績紀錄已成功儲存！', 'success');
        }

        function deleteRecord(id) {
            recordsList = recordsList.filter(r => r.id !== id);
            saveDataToLocalStorage();
            updateDashboardStats();
            renderRecordsModalList();
            if (!document.getElementById('chartModal').classList.contains('hidden')) {
                renderProfitChart();
            }
            showMessage('刪除', '該筆戰績紀錄已刪除。', 'info');
        }

        function updateDashboardStats() {
            let targetRecords = recordsList;
            if (currentFilterGame !== 'ALL') {
                targetRecords = recordsList.filter(r => r.game === currentFilterGame);
                document.getElementById('labelNetProfitTitle').innerText = `${currentFilterGame} 淨利`;
                document.getElementById('labelBuyinTitle').innerText = `${currentFilterGame} 買入`;
                document.getElementById('labelCashoutTitle').innerText = `${currentFilterGame} 出金`;
                document.getElementById('labelRakeTitle').innerText = `${currentFilterGame} 水錢`;
            } else {
                document.getElementById('labelNetProfitTitle').innerText = '總淨利';
                document.getElementById('labelBuyinTitle').innerText = '總買入';
                document.getElementById('labelCashoutTitle').innerText = '總出金';
                document.getElementById('labelRakeTitle').innerText = '總水錢';
            }

            let totalBuyin = 0;
            let totalCashout = 0;
            let totalRake = 0;

            targetRecords.forEach(rec => {
                totalBuyin += rec.buyin;
                totalCashout += rec.cashout;
                totalRake += rec.rake;
            });

            const netProfit = (totalCashout + totalRake) - totalBuyin;

            const profitEl = document.getElementById('statNetProfit');
            profitEl.innerText = (netProfit >= 0 ? '+$' : '-$') + Math.abs(netProfit).toLocaleString();
            profitEl.className = `text-xl md:text-2xl font-black font-display tracking-tight ${netProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            document.getElementById('statTotalBuyin').innerText = '$' + totalBuyin.toLocaleString();
            document.getElementById('statTotalCashout').innerText = '$' + totalCashout.toLocaleString();
            document.getElementById('statTotalRake').innerText = '$' + totalRake.toLocaleString();
        }

        function openChartModal() {
            document.getElementById('chartModal').classList.remove('hidden');
            renderProfitChart();
        }

        function closeChartModal() {
            document.getElementById('chartModal').classList.add('hidden');
        }

        function renderProfitChart() {
            const ctx = document.getElementById('profitChart').getContext('2d');
            let targetRecords = recordsList;
            if (currentFilterGame !== 'ALL') {
                targetRecords = recordsList.filter(r => r.game === currentFilterGame);
                document.getElementById('chartTitle').innerHTML = `<i class="fa-solid fa-chart-line mr-2"></i> 累積獲利曲線圖 (${currentFilterGame})`;
            } else {
                document.getElementById('chartTitle').innerHTML = `<i class="fa-solid fa-chart-line mr-2"></i> 累積獲利曲線圖 (全部總和)`;
            }

            const sortedRecords = [...targetRecords].sort((a, b) => new Date(a.date) - new Date(b.date));

            let cumulative = 0;
            const labels = [];
            const dataPoints = [];

            if (sortedRecords.length > 0) {
                labels.push('起始');
                dataPoints.push(0);
            }

            sortedRecords.forEach((rec) => {
                const profit = (rec.cashout + rec.rake) - rec.buyin;
                cumulative += profit;
                labels.push(rec.date.replace('T', ' '));
                dataPoints.push(cumulative);
            });

            if (profitChartInstance) {
                profitChartInstance.destroy();
            }

            profitChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '累積淨利 ($)',
                        data: dataPoints,
                        borderColor: '#fbbf24',
                        backgroundColor: 'rgba(251, 191, 36, 0.08)',
                        borderWidth: 3,
                        pointBackgroundColor: '#fbbf24',
                        pointBorderColor: '#07120d',
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#f3f4f6',
                                font: {
                                    family: 'Fredoka',
                                    size: 14
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(7, 18, 13, 0.95)',
                            titleFont: { family: 'Noto Sans TC', size: 14 },
                            bodyFont: { family: 'Fredoka', size: 14 },
                            borderColor: '#10b981',
                            borderWidth: 1,
                            callbacks: {
                                label: function(context) {
                                    let val = context.parsed.y;
                                    return ' 累積淨利: $' + val.toLocaleString();
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.04)' },
                            ticks: { color: '#9ca3af', font: { size: 11 } }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.04)' },
                            ticks: {
                                color: '#9ca3af',
                                font: { size: 11 },
                                callback: function(value) {
                                    return '$' + value.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });
        }

        function openRecordsModal() {
            document.getElementById('recordsModal').classList.remove('hidden');
            document.getElementById('modalFilterGame').value = currentFilterGame;
            renderRecordsModalList();
        }

        function closeRecordsModal() {
            document.getElementById('recordsModal').classList.add('hidden');
        }

        function renderRecordsModalList() {
            const tbody = document.getElementById('recordsTableBody');
            const emptyState = document.getElementById('emptyState');
            const filterGame = document.getElementById('modalFilterGame').value;

            tbody.innerHTML = '';

            let filtered = recordsList;
            if (filterGame !== 'ALL') {
                filtered = recordsList.filter(r => r.game === filterGame);
            }

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(rec => {
                const netProfit = (rec.cashout + rec.rake) - rec.buyin;
                const netProfitFormatted = (netProfit >= 0 ? '+' : '') + netProfit.toLocaleString();
                const netProfitColor = netProfit >= 0 ? 'text-emerald-400' : 'text-rose-400';

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-emerald-950/40 transition-colors';
                tr.innerHTML = `
                    <td class="py-3 px-3 text-xs md:text-sm text-emerald-400/80 whitespace-nowrap">${rec.date.replace('T', ' ')}</td>
                    <td class="py-3 px-3 font-semibold text-white whitespace-nowrap"><span class="bg-[#030705] border border-emerald-800/80 px-2.5 py-1 rounded-full text-xs">${rec.game}</span></td>
                    <td class="py-3 px-3 text-right font-mono text-red-400">-$${rec.buyin.toLocaleString()}</td>
                    <td class="py-3 px-3 text-right font-mono text-blue-400">+$${rec.cashout.toLocaleString()}</td>
                    <td class="py-3 px-3 text-right font-mono text-yellow-300">+$${rec.rake.toLocaleString()}</td>
                    <td class="py-3 px-3 text-right font-mono font-bold ${netProfitColor}">${netProfitFormatted}</td>
                    <td class="py-3 px-3 text-center text-xs text-emerald-400/70 truncate max-w-[120px]" title="${rec.note || ''}">${rec.note || '-'}</td>
                    <td class="py-3 px-3 text-center whitespace-nowrap">
                        <button onclick="openRecordModal('${rec.id}')" class="text-yellow-400 hover:text-yellow-300 mr-2 p-1" title="編輯"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteRecord('${rec.id}')" class="text-rose-400 hover:text-rose-300 p-1" title="刪除"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openGameManagerModal() {
            document.getElementById('gameManagerModal').classList.remove('hidden');
            renderGameListManager();
        }

        function closeGameManagerModal() {
            document.getElementById('gameManagerModal').classList.add('hidden');
            renderGameFilterButtons();
            updateGameOptions();
            updateDashboardStats();
        }

        function renderGameListManager() {
            const container = document.getElementById('gameListContainer');
            container.innerHTML = '';

            gamesList.forEach((game, index) => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-[#030705] border border-emerald-800/70 rounded-xl px-4 py-2.5';
                
                item.innerHTML = `
                    <span class="text-white font-medium text-sm"><i class="fa-solid fa-dice text-yellow-400 mr-2"></i>${game}</span>
                    <button onclick="deleteCustomGame(${index})" class="text-rose-400 hover:text-rose-300 text-sm"><i class="fa-solid fa-trash-can"></i></button>
                `;
                container.appendChild(item);
            });
        }

        function openQuickAddGameModal() {
            document.getElementById('quickGameInput').value = '';
            document.getElementById('quickAddGameModal').classList.remove('hidden');
        }

        function closeQuickAddGameModal() {
            document.getElementById('quickAddGameModal').classList.add('hidden');
        }

        function submitQuickAddGame() {
            const input = document.getElementById('quickGameInput');
            const gameName = input.value.trim();
            if (!gameName) {
                showMessage('提示', '請輸入有效的遊戲名稱！', 'error');
                return;
            }
            if (gamesList.includes(gameName)) {
                showMessage('提示', '此遊戲類型欄位已經存在！', 'error');
                return;
            }

            gamesList.push(gameName);
            saveDataToLocalStorage();
            renderGameFilterButtons();
            updateGameOptions();
            closeQuickAddGameModal();
            showMessage('成功', `已成功建立「${gameName}」遊戲欄位！`, 'success');
        }

        function deleteCustomGame(index) {
            if (gamesList.length <= 1) {
                showMessage('提示', '至少需要保留一個遊戲欄位！', 'error');
                return;
            }
            const deletedGame = gamesList[index];
            gamesList.splice(index, 1);
            if (currentFilterGame === deletedGame) {
                currentFilterGame = 'ALL';
            }
            saveDataToLocalStorage();
            renderGameListManager();
            renderGameFilterButtons();
            updateGameOptions();
            updateDashboardStats();
        }

        function saveDataToLocalStorage() {
            localStorage.setItem('poker_games', JSON.stringify(gamesList));
            localStorage.setItem('poker_records', JSON.stringify(recordsList));
        }

        function exportData() {
            const data = {
                games: gamesList,
                records: recordsList,
                version: '1.6',
                exportDate: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `poker_ledger_dark_backup_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.records && Array.isArray(data.records)) {
                        recordsList = data.records;
                    }
                    if (data.games && Array.isArray(data.games)) {
                        gamesList = data.games;
                    }
                    saveDataToLocalStorage();
                    currentFilterGame = 'ALL';
                    renderGameFilterButtons();
                    updateGameOptions();
                    updateDashboardStats();
                    showMessage('成功', '資料已成功匯入還原！', 'success');
                } catch (err) {
                    showMessage('錯誤', '檔案格式錯誤，無法解析備份檔案！', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
    </script>


    <script>
        // PWA shortcut: ?action=add → 直接開啟「新增戰績」modal
        (function () {
            try {
                const p = new URLSearchParams(window.location.search);
                if (p.get('action') !== 'add') return;
                const go = function () {
                    setTimeout(function () {
                        if (typeof openRecordModal === 'function') openRecordModal();
                    }, 300);
                };
                if (document.readyState === 'complete') go();
                else window.addEventListener('load', go);
            } catch (e) {}
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (e) {
                    console.warn('SW registration failed', e);
                });
            });
        }
    </script>
</body>
</html>
